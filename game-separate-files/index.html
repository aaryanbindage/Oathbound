<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
</head>
<body>
<title>Oathbound</title>
<style>
:root { --void: #05070f; --gold: #e8c877; --gold-dim: #8a7038; --pad: rgba(20, 28, 54, 0.62); color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--void); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#game { image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; display: block; background: #000; outline: none; }
#touch { position: absolute; inset: 0; pointer-events: none; display: none; }
body.touch #touch { display: block; }
.tb { position: absolute; pointer-events: auto; width: 54px; height: 54px; border: 2px solid var(--gold-dim); background: var(--pad); color: var(--gold); font: 700 15px monospace; border-radius: 8px; padding: 0; touch-action: none; }
.tb:active, .tb.on { background: rgba(232, 200, 119, 0.4); }
#t-up { left: 66px; bottom: 122px; } #t-down { left: 66px; bottom: 10px; } #t-left { left: 10px; bottom: 66px; } #t-right { left: 122px; bottom: 66px; }
#t-ok { right: 12px; bottom: 58px; width: 66px; height: 66px; border-radius: 50%; } #t-back { right: 88px; bottom: 16px; border-radius: 50%; } #t-menu { right: 12px; top: 12px; width: 62px; height: 36px; }
</style>
<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="Oathbound game screen"></canvas>
  <div id="touch" aria-hidden="true">
    <button class="tb" id="t-up" data-a="up">&#9650;</button><button class="tb" id="t-down" data-a="down">&#9660;</button>
    <button class="tb" id="t-left" data-a="left">&#9664;</button><button class="tb" id="t-right" data-a="right">&#9654;</button>
    <button class="tb" id="t-ok" data-a="ok">OK</button><button class="tb" id="t-back" data-a="back">BACK</button>
    <button class="tb" id="t-menu" data-a="menu">MENU</button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/maps.js"></script>
<script src="js/battle.js"></script>
<script src="js/story.js"></script>
<script src="js/field.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
